<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do list</title>
    <style>
        body{
            width: 100%;
            height:100vh;
           display: flex;
           justify-content: center;
           align-items: center;
           background-color: rgb(45, 108, 119);
        }
        .container{
             display: flex;
             justify-content: center;
           
            flex-direction: column;
            background-color:rgb(52, 158, 157);
            padding:0px 20px;   
            border-radius:10px;      
        }
        .header{
            width:350px;
            display: flex;
            justify-content: space-between;
            
        }
        .main{
            align-self: center;
        }
        .main1{
            width:40px;
            height: 40px;
            background-color: rgb(84, 84, 248);
            border-radius: 5px;
            align-self:center;
        }
        img{
            width: 38px;
            height: 38px;
        }
        h1{
            margin-bottom: -12px;
        }
        input{
            border-radius: 5px;
            margin-bottom: 10px;
            border: 2px solid black;
            padding: 8px;
            width: 230px;
            font-weight: 600;
        }
        .submit{
          color: white;
          background-color: black;
          padding: 7px;
          width:100px;
          border-radius: 5px;
          font-weight: 600;
          font-size:1rem;
        }
        .btn{
            display: flex;
            justify-content: space-between;
        }
        .btn1{
            background-color: white;
            color: black;
            width:113px;
            padding: 6px;
            font-weight: 550;
           
            
        }
        .footer{
            display: flex;
            justify-content:space-between;
        }
    </style>
</head>
<body>
    <div class="container">
       <div class="header">
        <div class="main">
        <h1>My Tasks ✨</h1>
        <p>Make Today Count.</p>
        </div>
        <div class="main1"><img src="calendar-check.png" alt=""></div>
       </div> 
       <div class="progress">
        <div class="pr1">
        <h2>Today's Progress</h2>
        <p class="percent"></p>
        </div>
       </div>
       <div class="add">
    
        <input type="text" placeholder="Add a new task..." required class="write">
        <button class="submit">+ Add</button>
       </div>
       <div class="btn">
        <button class="btn1" id="but1">All</button>
         <button class="btn1" id="but2">Active</button>
          <button class="btn1"id="but3">Completed</button>
       </div>
       <div class="tasks"></div>
       <div class="footer"><p><span id="no">0</span> tasks remaining</p>
        <p class="complete">clear completed</p>
    </div>
       
    </div>
    
<script>
    var write = document.querySelector(".write");
    var task = document.querySelector(".tasks");
    var submit = document.querySelector(".submit");

    var but1 = document.querySelector("#but1");
    var but2 = document.querySelector("#but2");
    var but3 = document.querySelector("#but3");

    var no = document.querySelector("#no");
    var percent = document.querySelector(".percent");
    var clear = document.querySelector(".complete");

    var filter = "all";

    submit.addEventListener("click", function () {
        if (write.value.trim() !== "") {
            var newtask = document.createElement("div");
            var checkbox = document.createElement("input");
            var text = document.createElement("span");

            newtask.className = "task-item";

            checkbox.type = "checkbox";
            text.textContent = write.value.trim();

            checkbox.style.width = "18px";
            checkbox.style.marginRight = "10px";
            checkbox.style.marginBottom = "0";

            newtask.style.display = "flex";
            newtask.style.alignItems = "center";
            newtask.style.gap = "8px";
            newtask.style.border = "1px solid black";
            newtask.style.borderRadius = "8px";
            newtask.style.marginTop = "8px";
            newtask.style.padding = "10px";

            newtask.appendChild(checkbox);
            newtask.appendChild(text);
            task.appendChild(newtask);
            checkbox.addEventListener("change", function () {
                updateTask(newtask, checkbox, text);
            });

            write.value = "";
            updateTaskList();
        }
    });
    function updateTask(newtask, checkbox, text) {
        if (checkbox.checked) {
            text.style.textDecoration = "line-through";
            text.style.color = "gray";
        } else {
            text.style.textDecoration = "none";
            text.style.color = "black";
        }

        updateTaskList();
    }
    function updateTaskList() {
        var tasks = document.querySelectorAll(".task-item");
        var remaining = 0;
        var completed = 0;

        tasks.forEach(function (item) {
            var checkbox = item.querySelector("input");
            var text = item.querySelector("span");

            if (!checkbox.checked) {
                remaining++;
            } else {
                completed++;
            }

            if (filter === "all") {
                item.style.display = "flex";
            } else if (filter === "active") {
                item.style.display = checkbox.checked ? "none" : "flex";
            } else if (filter === "completed") {
                item.style.display = checkbox.checked ? "flex" : "none";
            }
        });
        no.textContent = remaining;
        var progress = tasks.length === 0 ? 0 : Math.round((completed / tasks.length) * 100);
        percent.textContent = progress + "% completed";
        but1.style.backgroundColor = filter === "all" ? "black" : "white";
        but1.style.color = filter === "all" ? "white" : "black";

        but2.style.backgroundColor = filter === "active" ? "black" : "white";
        but2.style.color = filter === "active" ? "white" : "black";

        but3.style.backgroundColor = filter === "completed" ? "black" : "white";
        but3.style.color = filter === "completed" ? "white" : "black";
    }
    but1.addEventListener("click", function () {
        filter = "all";
        updateTaskList();
    });

    but2.addEventListener("click", function () {
        filter = "active";
        updateTaskList();
    });

    but3.addEventListener("click", function () {
        filter = "completed";
        updateTaskList();
    });

    clear.style.cursor = "pointer";

    clear.addEventListener("click", function () {
        var tasks = document.querySelectorAll(".task-item");

        tasks.forEach(function (item) {
            if (item.querySelector("input").checked) {
                item.remove();
            }
        });

        updateTaskList();
    });
    updateTaskList();
</script>

</body>
</html>
